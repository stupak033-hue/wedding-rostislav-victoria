<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e8df">
<meta name="description" content="Свадебное приглашение Ростислава и Виктории — 23 июля 2027 года, Тюмень.">
<title>Ростислав и Виктория — 23.07.2027</title>
<style>
:root{--brown:#60351f;--gold:#b7834e;--cream:#fff8f0;--panel:rgba(255,247,239,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2ded3;color:var(--brown);font-family:Georgia,'Times New Roman',serif}
#app{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow-x:hidden;overflow-y:auto;background:#f8e8df;box-shadow:0 0 28px #6e493022;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen{position:relative;inset:auto;display:block;flex:none;width:100%;height:100dvh;min-height:100dvh;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.hotspot{position:absolute;z-index:5;left:8%;right:8%;bottom:8%;height:12%;border:0;background:transparent}
.maplink{position:absolute;z-index:5;left:17%;right:17%;top:78%;height:9%;border-radius:30px}
.program-panel{position:absolute;z-index:3;left:36%;right:7%;top:29%;height:48%;background:linear-gradient(110deg,rgba(250,236,226,.97),rgba(255,246,238,.94));border-radius:14px;padding:5% 3%;display:flex;flex-direction:column;justify-content:space-around;box-shadow:0 2px 8px #8b5a3520}
.event{font-family:'Noto Serif',Georgia,serif;font-size:clamp(11px,3.5vw,16px);line-height:1.28;color:#57321f}
.event strong{display:block;font-weight:600;font-size:1.12em;margin-bottom:3px;color:#60351f}
.form-panel{position:absolute;z-index:4;left:8%;right:8%;top:30%;bottom:13%;border:1px solid #d6ae8d;border-radius:18px;background:var(--panel);box-shadow:0 8px 24px #80512c20;backdrop-filter:blur(4px);padding:4% 5%;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.6vh,12px);overflow:auto}
.form-panel h2{text-align:center;font-weight:400;font-size:clamp(17px,5vw,22px);margin:0 0 4px;color:#663d27}
.field label,.field-title{font-size:clamp(12px,3.4vw,15px);display:block;margin:0 0 4px}
.field input,.field select{width:100%;min-height:38px;border:1px solid #d6b292;border-radius:12px;background:#fffdf9;padding:8px 11px;font:14px Georgia,serif;color:#60351f}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:5px;font-size:14px}
.radios input{accent-color:#a87343}
.submit{border:1px solid #a87543;border-radius:28px;background:linear-gradient(#e3bd92,#b17b48);color:white;min-height:42px;padding:8px 15px;font:15px Georgia,serif;box-shadow:0 3px 8px #95612f30}
.notice{text-align:center;font-size:12px;min-height:15px;margin:0}
.timer-values{position:absolute;z-index:4;left:8%;right:8%;top:31%;height:37%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4% 4%;pointer-events:none}
.timer-values div{display:flex;align-items:flex-end;justify-content:center;padding-bottom:8%;font-size:clamp(27px,8vw,39px);font-weight:400;color:#62391f;text-shadow:0 1px 1px #fff}
.timer-date{position:absolute;z-index:4;top:70%;left:8%;right:8%;text-align:center;font-size:clamp(14px,4vw,18px);line-height:1.35;color:#633a22;background:#f9e9dfd9;border-radius:8px;padding:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-height:690px){.form-panel{top:27%;bottom:10%;gap:5px;padding:3% 4%}.field input,.field select{min-height:33px}.submit{min-height:36px}}
</style>
</head>
<body>
<main id="app">
<section class="screen" aria-label="Закрытый конверт"><img class="art" src="assets/screen-1.jpg" alt="Закрытый свадебный конверт среди пионов и жемчуга"><button class="hotspot" onclick="go(1)" aria-label="Открыть приглашение"></button></section>
<section class="screen" aria-label="Открытое приглашение"><img class="art" src="assets/screen-2.jpg" alt="Открытый конверт с карточкой приглашения Ростислава и Виктории"></section>
<section class="screen" aria-label="Место проведения"><img class="art" src="assets/screen-3.jpg" alt="Место проведения свадьбы — ЗАГС в Тюмени"><a class="maplink" href="https://www.google.com/maps/search/?api=1&query=Тюмень%2C%20ул.%20Малыгина%2C%20д.%2085" target="_blank" rel="noopener" aria-label="Открыть адрес на карте"></a></section>
<section class="screen" aria-label="Программа дня"><img class="art" src="assets/screen-4.jpg" alt="Цветочное оформление программы свадебного дня"><div class="program-panel"><div class="event"><strong>16:00</strong>Церемония</div><div class="event"><strong>17:00</strong>Поздравления и фотографии</div><div class="event"><strong>18:00</strong>Праздничная программа и банкет</div></div></section>
<section class="screen" aria-label="Анкета гостя"><img class="art" src="assets/screen-5.jpg" alt="Цветочная карточка анкеты гостя"><form class="form-panel" name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="submitForm(event,this,'rsvpNotice')"><input type="hidden" name="form-name" value="rsvp"><input type="hidden" name="bot-field"><h2>Подтвердите присутствие</h2><div class="field"><label for="guestName">Ваше имя*</label><input id="guestName" name="Имя гостя" autocomplete="name" required placeholder="Введите ваше имя"></div><div class="field"><span class="field-title">Вы придёте?*</span><div class="radios"><label><input type="radio" name="Присутствие" value="Да, буду" required> Да, буду</label><label><input type="radio" name="Присутствие" value="Не смогу приехать"> Не смогу приехать</label></div></div><div class="field"><label for="guestCount">Количество гостей</label><select id="guestCount" name="Количество гостей"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div><button class="submit" type="submit">Отправить ответ</button><p class="notice" id="rsvpNotice" aria-live="polite"></p></form></section>
<section class="screen" aria-label="Пожелания по блюдам и напиткам"><img class="art" src="assets/screen-6.jpg" alt="Цветочная карточка предпочтений"><form class="form-panel" name="preferences" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="submitForm(event,this,'prefsNotice')"><input type="hidden" name="form-name" value="preferences"><input type="hidden" name="bot-field"><h2>Ваши предпочтения</h2><div class="field"><span class="field-title">Горячее блюдо*</span><div class="radios"><label><input type="radio" name="Горячее блюдо" value="Мясное горячее" required> Мясное горячее</label><label><input type="radio" name="Горячее блюдо" value="Рыбное горячее"> Рыбное горячее</label></div></div><div class="field"><label for="alcohol">Спиртные напитки</label><input id="alcohol" name="Спиртные напитки" placeholder="Ваш вариант"></div><div class="field"><label for="drinks">Напитки</label><input id="drinks" name="Напитки" placeholder="Ваш вариант"></div><button class="submit" type="submit">Сохранить выбор</button><p class="notice" id="prefsNotice" aria-live="polite"></p></form></section>
<section class="screen" aria-label="Обратный отсчёт"><img class="art" src="assets/screen-7.jpg" alt="Карточка обратного отсчёта до свадьбы"><div class="timer-values"><div id="days">—</div><div id="hours">—</div><div id="minutes">—</div><div id="seconds">—</div></div><div class="timer-date">23 июля 2027 года<br>в 16:00</div></section>
<section class="screen" aria-label="Спасибо"><img class="art" src="assets/screen-8.jpg" alt="Спасибо, что вы с нами! Ростислав и Виктория"></section>
</main>
<script>
'use strict';
const app=document.getElementById('app');
const originals=Array.from(app.querySelectorAll('.screen'));
const total=originals.length;
let index=0, settleTimer;
const lastClone=originals[total-1].cloneNode(true);
const firstClone=originals[0].cloneNode(true);
lastClone.setAttribute('aria-hidden','true');
firstClone.setAttribute('aria-hidden','true');
lastClone.querySelectorAll('button,a,input,select,textarea').forEach(el=>{el.tabIndex=-1;el.disabled=true});
firstClone.querySelectorAll('button,a,input,select,textarea').forEach(el=>{el.tabIndex=-1;el.disabled=true});
app.insertBefore(lastClone,originals[0]);
app.appendChild(firstClone);
function cardHeight(){return app.clientHeight}
function jumpTo(position){app.scrollTop=position*cardHeight()}
function go(n){
 let target=n;
 if(target<0)target=total-1;
 if(target>=total)target=0;
 index=target;
 app.scrollTo({top:(index+1)*cardHeight(),behavior:'smooth'});
}
function settleScroll(){
 const h=cardHeight();
 if(!h)return;
 let pos=Math.round(app.scrollTop/h);
 if(pos===0){app.scrollTo({top:total*h,behavior:'instant'});pos=total;}
 else if(pos===total+1){app.scrollTo({top:h,behavior:'instant'});pos=1;}
 index=Math.max(0,Math.min(total-1,pos-1));
}
app.addEventListener('scroll',()=>{
 clearTimeout(settleTimer);
 settleTimer=setTimeout(settleScroll,120);
},{passive:true});
window.addEventListener('resize',()=>{jumpTo(index+1)});
requestAnimationFrame(()=>jumpTo(1));
const weddingDate=new Date('2027-07-23T16:00:00+05:00');
function tick(){
 let ms=Math.max(0,weddingDate.getTime()-Date.now());
 const v={days:Math.floor(ms/86400000),hours:Math.floor(ms%86400000/3600000),minutes:Math.floor(ms%3600000/60000),seconds:Math.floor(ms%60000/1000)};
 for(const [id,n] of Object.entries(v))document.getElementById(id).textContent=String(n).padStart(2,'0');
}
tick();setInterval(tick,1000);
async function submitForm(e,form,noticeId){
 e.preventDefault();
 const notice=document.getElementById(noticeId);
 const data=new FormData(form);
 const encoded=new URLSearchParams(data).toString();
 try{
  const response=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:encoded});
  if(!response.ok)throw new Error('form endpoint unavailable');
  notice.textContent='Спасибо! Ваш ответ отправлен.';
  form.querySelector('button[type=submit]').disabled=true;
  return;
 }catch(netlifyError){
  try{
   const values=Object.fromEntries(data.entries());
   const key='wedding-'+form.name+'-responses';
   const old=JSON.parse(localStorage.getItem(key)||'[]');
   old.push({...values,submittedAt:new Date().toISOString()});
   localStorage.setItem(key,JSON.stringify(old));
   notice.textContent='Ответ сохранён только на этом устройстве. Для отправки организаторам откройте приглашение на сайте, опубликованном через Netlify.';
   form.querySelector('button[type=submit]').disabled=true;
  }catch(storageError){
   notice.textContent='Не удалось сохранить ответ. Проверьте настройки браузера и попробуйте ещё раз.';
  }
 }
}
</script>
</body>
</html>
